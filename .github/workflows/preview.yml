name: preview

# PR 预览环境:每个 PR 部署一份到 pr-<编号> 分支(CF Pages 自动给 <branch>.sai-assets.pages.dev 别名),
# 并在 PR 里回评地址 —— 改包的人不用本地起服务器就能看到效果。
# 只跑同仓 PR:fork 的 PR 拿不到 secrets,跳过部署只跑闸。

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 公开内容闸 + 包内断言
        run: python scripts/gate.py

      - name: 构建站点
        run: python scripts/build_site.py --out dist

      - name: 部署预览环境
        id: deploy
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@3 pages deploy dist \
            --project-name=sai-assets \
            --branch=pr-${{ github.event.number }} \
            --commit-dirty=true 2>&1 | tee /tmp/deploy.log
          url=$(grep -oE 'https://[a-z0-9-]+\.sai-assets\.pages\.dev' /tmp/deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: 在 PR 里回评预览地址
        if: steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const body = `站点预览已就绪(本次提交的构建产物):${url}\n\n目录里的每个包都会自动出现;缺预览/zip/详情页时构建会直接失败,不会发出坏预览。`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const mine = comments.find((c) => c.body.includes("站点预览已就绪"));
            if (mine) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
