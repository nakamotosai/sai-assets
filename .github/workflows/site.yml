name: site

# 展示站自动导入管线:main 上有任何改动(packs/ 新增、包修改、docs)→ 重建站点 → 部署 Cloudflare Pages。
# 唯一入口是 packs/*/pack.json:新增一个包目录即自动上站,没有第二个注册表。
# catalog.json 是**派生**文件(packs/ 是真相源):提交里那份过期时本工作流自动重建并回提交,
# 于是「只往 packs/ 丢一个目录、catalog 没跟」也能上站,不必依赖人记得跑 build_catalog。
# 自检在 scripts/build_site.py 的 verify():详情页/预览/zip/子 demo/sitemap 任一对不上即非零退出,不会部署坏产物。

on:
  push:
    branches: [main]
  workflow_dispatch:

# 自动对齐 catalog.json 需要写权限;gate.yml / preview.yml 各自显式声明 read,不受影响。
# 注意:BOT 用 GITHUB_TOKEN 推的提交不会再触发工作流,天然无回环。
permissions:
  contents: write

concurrency:
  group: site-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 公开内容闸 + 包内断言
        run: python scripts/gate.py

      - name: 重建 catalog(packs/ 为真相源;提交里那份过期就自动对齐并回提交)
        run: |
          python scripts/build_catalog.py
          if git diff --quiet -- catalog.json; then
            echo "catalog.json 与 packs/ 一致,无需对齐"
            exit 0
          fi
          echo "::notice::catalog.json 与 packs/ 不一致 —— 本次由 CI 重建并回提交,站点照常部署"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "chore(catalog): CI 自动对齐 packs/(提交里那份过期)"
          git push origin HEAD:main

      - name: 构建站点(含 verify:30 包详情页 / 预览 / zip / 子 demo / sitemap)
        run: python scripts/build_site.py --out dist

      - name: 部署 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy dist --project-name=sai-assets --branch=main --commit-dirty=true
