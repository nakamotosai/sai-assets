name: gate

# 公开内容闸:任何 push / PR / 手触发都跑一遍 scripts/gate.py(三层:schema + 清洗 + 断言)。
# 只读仓内容,不推代码、不用 secrets。
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python scripts/gate.py
        run: python scripts/gate.py
