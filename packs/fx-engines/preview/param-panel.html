<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#05060a" />
<title>fx-engines · 悬浮调参板(全字段)</title>
<link rel="stylesheet" href="./stage.css" />
<link rel="stylesheet" href="../src/param-panel.css" />
<style>
  body { overflow: auto }
  .board { position: relative; z-index: 1; padding: 72px 20px 40px; max-width: 980px; margin: 0 auto }
  .board h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px }
  .board p.lead { color: var(--dim); font-size: 12px; margin-bottom: 18px; max-width: 62ch }
  .tiles { display: grid; gap: var(--demo-gap, 12px); grid-template-columns: repeat(var(--demo-columns, 3), minmax(0, 1fr)) }
  .tile { position: relative; border: 1px solid #ffffff1a; border-radius: var(--demo-radius, 12px);
    background: #0b0d12; padding: 22px 16px; min-height: 104px; overflow: hidden; transition: border-radius .18s, border-color .18s }
  .tile::after { content: ""; position: absolute; inset: 0; opacity: var(--demo-grain, .35); pointer-events: none;
    background-image: radial-gradient(#ffffff26 1px, transparent 1px); background-size: 4px 4px }
  .tile [data-tile] { font: 700 18px/1.3 ui-monospace, monospace; letter-spacing: .16em; color: var(--demo-accent, #fe8019) }
  [data-cell].is-on { border-color: var(--demo-accent, #fe8019) }
  pre[data-panel-json] { margin-top: 22px; padding: 14px; border: 1px solid #ffffff14; border-radius: 10px;
    background: #08090d; color: var(--dim); font: 500 12px/1.5 ui-monospace, monospace; overflow: auto }
  .hud a { color: var(--ink) }
</style>
</head>
<body>
<div class="hud">
  <b>param-panel</b> <span class="ver">v<span data-panel-version>—</span></span> · 全字段示例
  <br><span class="ver">swatch / range / select / number / checkbox / text + 分页 + 拖拽 + 缩放 + 设默认 / 撤回 / 复制 / 导出</span>
</div>

<main class="board" id="board">
  <h2>面板 → 你的 apply()</h2>
  <p class="lead">
    调参板只做一件事:把 <code>params.json</code> 的 schema 渲染成控件,每次改动回调 <code>onChange(values)</code>。
    下面这块样张吃的是同一份回调值(强调色 / 圆角 / 列数 / 间距 / 颗粒 / 字标),改任意旋钮立刻能看到。
  </p>
  <div class="tiles">
    <div class="tile" data-cell><span data-tile>PARAM</span></div>
    <div class="tile" data-cell><span>swatch → 边框与字色</span></div>
    <div class="tile" data-cell><span>range → 圆角 / 列数 / 间距</span></div>
  </div>
  <pre data-panel-json>{}</pre>
</main>

<script type="module">
  import { mountPanelDemo, apply } from '../src/panel-demo.js';

  const board = document.getElementById('board');
  const api = mountPanelDemo(board, { corner: 'br', title: 'Param Panel · 全字段' });
  apply(board, api.getParams());
</script>
</body>
</html>
